# OpenClash 远程规则集模板 - 优化版
# 最后更新: 2026-01-06 (基于您的原始配置优化)

port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false
external-controller: '0.0.0.0:9090'

dns:
  enable: true
  enhanced-mode: fake-ip  # 优化：配合 TUN 模式建议使用 fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query

tun:
  enable: true
  stack: system
  dns-hijack:
    - 'any:53'
  auto-route: true
  auto-detect-interface: true

# 策略组 (Proxy Groups)
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - 自动切换
      - 香港优选
      - 台湾优选
      - 日本优选
      - 狮城优选
      - 美国优选

  - name: 自动切换
    type: fallback
    proxies:
      - 狮城优选
      - 美国优选
      - 日本优选
      - 台湾优选
      - 香港优选
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AI服务
    type: select
    proxies:
      - 美国优选
      - 日本优选
      - PROXY

  - name: 流媒体与解锁
    type: select
    proxies:
      - 自动切换
      - PROXY
      - 香港优选

  # --- 节点自动测速分组 (需在 OpenClash 设置关键字筛选) ---
  - name: 香港优选
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 900
    tolerance: 30
    proxies: [] # 实际运行时 OpenClash 会根据正则填充节点

  - name: 台湾优选
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 900
    proxies: []

  - name: 日本优选
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 900
    proxies: []

  - name: 狮城优选
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 900
    proxies: []

  - name: 美国优选
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 900
    proxies: []

  # 其他策略组 (国际规则, 谷歌, 苹果, 微软等) 保持您原有的结构...
  - name: 国际规则
    type: select
    proxies: [自动切换, PROXY, DIRECT]
  - name: 微信消息
    type: select
    proxies: [DIRECT, PROXY]

# 规则集 (Rule Providers) - 保持原有配置
rule-providers:
  Lan: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list", path: ./ruleset/Lan.yaml, interval: 86400}
  # ... 其他 provider 保持不变 ...

# 规则 (Rules)
rules:
  # 1. 优先级最高：局域网与基础直连
  - RULE-SET,Lan,DIRECT
  - DOMAIN-SUFFIX,superchat.live,国际规则
  
  # 2. 社交与重要应用 (建议排在通用规则前)
  - RULE-SET,WeChat,微信消息
  - DOMAIN-SUFFIX,t.me,电报消息
  - DOMAIN-SUFFIX,telegram.org,电报消息

  # 3. AI 服务
  - DOMAIN-SUFFIX,openai.com,AI服务
  - DOMAIN-SUFFIX,chatgpt.com,AI服务
  - DOMAIN-SUFFIX,claude.ai,AI服务
  - DOMAIN-SUFFIX,gemini.google.com,AI服务
  - DOMAIN-SUFFIX,sydney.bing.com,AI服务
  
  # 4. 视频与流媒体
  - RULE-SET,Netflix,流媒体与解锁
  - RULE-SET,Disney,流媒体与解锁
  - DOMAIN-SUFFIX,youtube.com,流媒体与解锁
  - DOMAIN-SUFFIX,ytimg.com,流媒体与解锁

  # 5. 常见国内直连 (您列出的购物、银行等)
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,meituan.com,DIRECT

  # 6. 其他规则集
  - RULE-SET,Apple,苹果服务
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Google,谷歌服务
  - RULE-SET,Bilibili,国内媒体
  - RULE-SET,MyRules,国际规则
  
  # 7. 兜底与国家代码
  - RULE-SET,China,DIRECT
  - RULE-SET,China_IP,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
